    <pattern id="arenberg-hatch" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="11" stroke="currentColor" stroke-width="1.76" stroke-opacity=".5"/>
    </pattern>
  </defs>
  
