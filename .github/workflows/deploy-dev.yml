name: Deploy to Dev (elise)

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  # Handmatig te starten vanaf het Actions-tabblad voor test/herdeploy naar dev
  workflow_dispatch:

# Een tweede push op dezelfde PR maakt de vorige run overbodig; die wordt
# afgebroken in plaats van een runner bezet te houden. Op main gebeurt dat
# bewust NIET: daar hoort elke commit haar eigen verify en deploy te krijgen.
concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Testwaarden voor de CI-checks
env:
  DATABASE_URL: postgresql://vtk:vtk@127.0.0.1:5432/vtk_test?schema=public
  BETTER_AUTH_SECRET: 4tFQwV8Gq2YcX9nB6mR3kL7sP5uD1zH0jA8eC4vN2xM
  BETTER_AUTH_URL: http://localhost:3000
  TICKETING_TOKEN_SECRET: 7gK3wQ9cT2mV8xN4pR6yH1dF5sL0aJ7uB9eC3zX6qWk
  TICKETING_MAINTENANCE_SECRET: 5nD8vL2qH7xM4cR9wT1sF6jK3pY0uA5eB8gN2zQ7mVc
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    name: Types, lint and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16@sha256:1beaa3084eee2676f20a9cd9928f0bf2c5bf674f8e49f81017912183d377c61c
        env:
          POSTGRES_USER: vtk
          POSTGRES_PASSWORD: vtk
          POSTGRES_DB: vtk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vtk -d vtk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      # Voor npm ci: een lockfile zonder de native binaries van dit platform
      # installeert "gewoon" en breekt pas veel later bij het builden.
      - name: Verify lockfile has every platform's native binaries
        run: npm run verify:lockfile

      - name: Install dependencies
        run: npm ci

      - name: Prepare Prisma client
        run: |
          cp .env.example .env
          npm run db:generate

      - name: Run unit tests
        run: |
          npm run test --workspace=@vtk/web
          npm run test --workspace=@vtk/logistiek

      # tsc is single-threaded en de runner heeft vier kernen, dus de drie apps
      # en eslint draaien naast elkaar: dat halveert deze stap. De typegen van
      # een app moet wel vóór haar eigen tsc blijven, vandaar de subshells.
      - name: Validate types and lint
        run: |
          jobs=()
          for app in web logistiek fakbar; do
            (
              npm exec --workspace=@vtk/$app -- next typegen
              npx tsc --noEmit -p apps/$app/tsconfig.build.json
            ) > "/tmp/check-types-$app.log" 2>&1 &
            jobs+=("$!:types-$app")
          done
          npm run lint --workspace=@vtk/web > /tmp/check-lint.log 2>&1 &
          jobs+=("$!:lint")

          failed=()
          for job in "${jobs[@]}"; do
            wait "${job%%:*}" || failed+=("${job##*:}")
          done
          for log in /tmp/check-*.log; do
            echo "::group::$log"
            cat "$log"
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::Mislukt: ${failed[*]}"
            exit 1
          fi

      - name: Apply migrations and run database integration tests
        run: |
          npx prisma migrate deploy --schema packages/db/prisma/schema.prisma
          npm run test:integration --workspace=@vtk/web
          npm run test:integration --workspace=@vtk/logistiek

  build:
    name: Production build and browser smoke
    runs-on: ubuntu-latest
    # `actions: read` om de laatste geslaagde run op te vragen; zie de stap
    # "Determine which apps to build".
    permissions:
      contents: read
      actions: read
    services:
      postgres:
        image: postgres:16@sha256:1beaa3084eee2676f20a9cd9928f0bf2c5bf674f8e49f81017912183d377c61c
        env:
          POSTGRES_USER: vtk
          POSTGRES_PASSWORD: vtk
          POSTGRES_DB: vtk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vtk -d vtk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Enkel bouwen wat deze commit raakt: een wijziging aan logistiek bouwt de
      # website niet, en een commit die enkel docs/ aanraakt bouwt niets. Welke
      # bestanden een app raken, leest scripts/affected-apps.mjs uit haar
      # Dockerfile, dezelfde regels als waarop Docker op de server zijn cache
      # baseert.
      #
      # Vergeleken wordt met de laatste commit waarvoor deze workflow op main
      # volledig slaagde, niet met de vorige commit. Faalde de build van een app,
      # dan blijft ze zo rood tot ze weer bouwt, ook wanneer de commit daarna
      # enkel docs/ aanraakt; anders zou die commit groen zijn en mocht hij naar
      # productie. Een PR vergelijkt met haar basis; een handmatige run bouwt
      # alles.
      - name: Determine which apps to build
        id: affected
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base=""
          if [ "$EVENT_NAME" = pull_request ]; then
            base="$PR_BASE"
          elif [ "$EVENT_NAME" = push ]; then
            base="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy-dev.yml --branch main \
              --status success --limit 1 --json headSha --jq '.[0].headSha // ""' || true)"
          fi
          # Enkel die ene commit ophalen: `git diff` vergelijkt twee bomen en
          # heeft de historie ertussen niet nodig.
          if [ -n "$base" ] && ! git fetch --no-tags --depth=1 origin "$base"; then
            echo "::warning::Kon $base niet ophalen; alle apps worden gebouwd."
            base=""
          fi
          apps="$(node scripts/affected-apps.mjs ${base:+"$base"})"
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          {
            echo "### Production build"
            echo "Vergeleken met: ${base:-niets, dus alles}"
            echo ""
            echo "Te bouwen: ${apps:-geen enkele app}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Te bouwen: ${apps:-geen enkele app} (vergeleken met ${base:-niets})"

      - name: Set up Node.js
        if: steps.affected.outputs.apps != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Install dependencies
        if: steps.affected.outputs.apps != ''
        run: npm ci

      - name: Prepare Prisma client
        if: steps.affected.outputs.apps != ''
        run: |
          cp .env.example .env
          npm run db:generate

      - name: Apply migrations
        if: steps.affected.outputs.apps != ''
        run: npx prisma migrate deploy --schema packages/db/prisma/schema.prisma

      # De Turbopack-buildcache van de vorige run op main: die hercompileert enkel
      # wat echt veranderd is. PR's lezen die cache wel in, maar schrijven zelf
      # geen nieuwe weg: anders uploadt elke PR-commit een archief van honderden
      # MB's en loopt de repo tegen de egress-limiet van GitHub Actions Cache aan.
      - name: Restore Next build cache
        id: next-cache
        if: steps.affected.outputs.apps != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            apps/web/.next/cache
            apps/logistiek/.next/cache
            apps/fakbar/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            next-${{ runner.os }}-

      - name: Build production application
        if: steps.affected.outputs.apps != ''
        env:
          APPS: ${{ steps.affected.outputs.apps }}
        run: |
          read -ra apps <<< "$APPS"
          for app in "${apps[@]}"; do
            npm run build --workspace="@vtk/$app"
          done

      - name: Save Next build cache
        if: steps.affected.outputs.apps != '' && github.ref == 'refs/heads/main' && steps.next-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            apps/web/.next/cache
            apps/logistiek/.next/cache
            apps/fakbar/.next/cache
          key: ${{ steps.next-cache.outputs.cache-primary-key }}

      # De browsertest draait tegen de website; zonder nieuwe build van de
      # website valt er niets nieuws te testen.
      - name: Resolve Playwright version
        id: playwright
        if: contains(format(' {0} ', steps.affected.outputs.apps), ' web ')
        run: |
          echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        if: contains(format(' {0} ', steps.affected.outputs.apps), ' web ')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright Chromium
        if: contains(format(' {0} ', steps.affected.outputs.apps), ' web ') && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Run browser security smoke
        if: contains(format(' {0} ', steps.affected.outputs.apps), ' web ')
        run: npm run test:e2e:tickets --workspace=@vtk/web

  deploy:
    name: Deploy to dev (elise)
    # Alleen deployen bij een push naar main of handmatige workflow_dispatch; nooit bij pull_request.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [checks, build]
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: https://dev.vtk.be

    steps:
      # Enkel nodig om infra/deploy.sh mee te hebben; de runner bouwt niets.
      - name: Checkout deploy script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: infra/deploy.sh
          sparse-checkout-cone-mode: false

      - name: Check required secrets for dev
        run: |
          if [ -z "${{ secrets.DEV_SSH_HOST }}" ]; then
            echo "::error::Secret DEV_SSH_HOST is not configured! Please add DEV_SSH_HOST to repository secrets."
            exit 1
          fi
          if [ -z "${{ secrets.DEV_SSH_KEY || secrets.SSH_KEY }}" ]; then
            echo "::error::Secret DEV_SSH_KEY (or SSH_KEY) is not configured! Please add DEV_SSH_KEY to repository secrets."
            exit 1
          fi

      - name: Install SSH key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEV_SSH_KEY || secrets.SSH_KEY }}

      # De deploylogica staat in infra/deploy.sh en wordt daarheen gepipet, zodat
      # ze in git leeft in plaats van als quoted string in deze workflow. `auto`
      # betekent: controleer de NFS-opslag enkel wanneer .env ze gebruikt.
      - name: Deploy through SSH
        env:
          SSH_USER: ${{ secrets.DEV_SSH_USER || secrets.SSH_USER || 'it' }}
          SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          GIT_SHA: ${{ github.sha }}
        run: |
          # `ServerAliveInterval`: tijdens het bouwen staat deze sessie minutenlang
          # stil (de drie builds schrijven naar een logbestand op de server), en
          # een stille TCP-verbinding wordt onderweg afgeschoten. Dat is precies
          # hoe run 34767614290 sneuvelde: "client_loop: send disconnect: Broken
          # pipe", 4,5 minuten na de laatste regel. De client stuurt nu elke 30
          # seconden een teken van leven en houdt het 20 keer vol, dus een echt
          # dode verbinding valt na tien minuten alsnog op.
          ssh -o StrictHostKeyChecking=no -o BatchMode=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "$SSH_USER@$SSH_HOST" \
            bash -s -- "$GIT_SHA" auto < infra/deploy.sh
