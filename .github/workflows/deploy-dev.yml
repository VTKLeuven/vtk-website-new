name: Deploy to Dev (elise)

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  # Handmatig te starten vanaf het Actions-tabblad voor test/herdeploy naar dev
  workflow_dispatch:

# Een tweede push op dezelfde PR maakt de vorige run overbodig; die wordt
# afgebroken in plaats van een runner bezet te houden. Op main gebeurt dat
# bewust NIET: daar hoort elke commit haar eigen verify en deploy te krijgen.
concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Testwaarden voor de CI-checks
env:
  DATABASE_URL: postgresql://vtk:vtk@127.0.0.1:5432/vtk_test?schema=public
  BETTER_AUTH_SECRET: 4tFQwV8Gq2YcX9nB6mR3kL7sP5uD1zH0jA8eC4vN2xM
  BETTER_AUTH_URL: http://localhost:3000
  TICKETING_TOKEN_SECRET: 7gK3wQ9cT2mV8xN4pR6yH1dF5sL0aJ7uB9eC3zX6qWk
  TICKETING_MAINTENANCE_SECRET: 5nD8vL2qH7xM4cR9wT1sF6jK3pY0uA5eB8gN2zQ7mVc

jobs:
  checks:
    name: Types, lint and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vtk
          POSTGRES_PASSWORD: vtk
          POSTGRES_DB: vtk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vtk -d vtk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Voor npm ci: een lockfile zonder de native binaries van dit platform
      # installeert "gewoon" en breekt pas veel later bij het builden.
      - name: Verify lockfile has every platform's native binaries
        run: npm run verify:lockfile

      - name: Install dependencies
        run: npm ci

      - name: Prepare Prisma client
        run: |
          cp .env.example .env
          npm run db:generate

      - name: Run unit tests
        run: |
          npm run test --workspace=@vtk/web
          npm run test --workspace=@vtk/logistiek

      - name: Validate types and lint
        run: |
          npm exec --workspace=@vtk/web -- next typegen
          npm exec --workspace=@vtk/logistiek -- next typegen
          npm exec --workspace=@vtk/fakbar -- next typegen
          npx tsc --noEmit -p apps/web/tsconfig.build.json
          npx tsc --noEmit -p apps/logistiek/tsconfig.build.json
          npx tsc --noEmit -p apps/fakbar/tsconfig.build.json
          npm run lint --workspace=@vtk/web

      - name: Apply migrations and run database integration tests
        run: |
          npx prisma migrate deploy --schema packages/db/prisma/schema.prisma
          npm run test:integration --workspace=@vtk/web

  build:
    name: Production build and browser smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vtk
          POSTGRES_PASSWORD: vtk
          POSTGRES_DB: vtk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vtk -d vtk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare Prisma client
        run: |
          cp .env.example .env
          npm run db:generate

      - name: Apply migrations
        run: npx prisma migrate deploy --schema packages/db/prisma/schema.prisma

      - name: Build production application
        run: |
          npm run build --workspace=@vtk/web
          npm run build --workspace=@vtk/logistiek
          npm run build --workspace=@vtk/fakbar

      - name: Resolve Playwright version
        id: playwright
        run: |
          echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Run browser security smoke
        run: npm run test:e2e:tickets --workspace=@vtk/web

  deploy:
    name: Deploy to dev (elise)
    # Alleen deployen bij een push naar main of handmatige workflow_dispatch; nooit bij pull_request.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [checks, build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check required secrets for dev
        run: |
          if [ -z "${{ secrets.DEV_SSH_HOST }}" ]; then
            echo "::error::Secret DEV_SSH_HOST is not configured! Please add DEV_SSH_HOST to repository secrets."
            exit 1
          fi
          if [ -z "${{ secrets.DEV_SSH_KEY || secrets.SSH_KEY }}" ]; then
            echo "::error::Secret DEV_SSH_KEY (or SSH_KEY) is not configured! Please add DEV_SSH_KEY to repository secrets."
            exit 1
          fi

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.DEV_SSH_KEY || secrets.SSH_KEY }}

      - name: Deploy through SSH
        env:
          SSH_USER: ${{ secrets.DEV_SSH_USER || secrets.SSH_USER || 'it' }}
          SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" "
            cd /home/it/vtk-website-new &&
            git fetch --all &&
            git reset --hard ${{ github.sha }} &&

            # Trigger de automount en controleer NFS alleen als /mnt/immich in .env geconfigureerd staat.
            if grep -qE '^IMMICH_MEDIA_LOCATION=.*/mnt/immich' .env 2>/dev/null; then
              timeout 30 stat /mnt/immich/.immich-storage-ready >/dev/null 2>&1 &&
              findmnt -rn -M /mnt/immich -t nfs4 >/dev/null
            fi &&

            # Build while current containers serve traffic
            docker compose -f infra/docker-compose.yml config --quiet &&
            docker compose -f infra/docker-compose.yml build &&

            # Migratie van bestaand IPv4-only default network indien van toepassing
            if docker network inspect infra_default --format '{{.EnableIPv6}}' 2>/dev/null |
              grep -qx false; then
              docker compose -f infra/docker-compose.yml down --remove-orphans
            fi &&

            docker compose -f infra/docker-compose.yml up -d --remove-orphans &&

            # Opruimen na de switch: alle ongebruikte containers, images en buildcache verwijderen.
            # Bewust zonder --volumes zodat database- en applicatiedata behouden blijft.
            { docker system prune -a -f || true; } &&
            { docker builder prune -a -f || true; }
          "
