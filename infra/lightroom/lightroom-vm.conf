# /etc/lightroom-vm/lightroom-vm.conf: read by /usr/local/bin/lightroom-vm (see lightroom-vm --help)

# The GPU lent to the VM (nvidia-smi index 0). Its audio function goes along.
GPU=0000:81:00.0

# No input over Parsec and no CPU work in the VM for this many minutes: the VM hibernates and
# vLLM comes back. Pressing start again while it runs counts as activity.
IDLE_MINUTES=30

# VM CPU use that counts as work (100 = one core), so a long Lightroom export keeps it awake.
BUSY_CPU_PERCENT=150

# Memory kenny keeps for itself after the VM has its 16 GB; below it a start is refused.
RAM_MARGIN_GB=4

# The Parsec link the website shows while the VM runs.
CONNECT_URL=

# A running job in one of these (pid file) blocks a start, and keeps vLLM stopped after one.
JOB_PIDFILES=/home/it/seg/job.pid /home/it/canal-sim-render/job.pid

# Services that keep every GPU open (beszel-agent's `nvidia-smi -l 4`): paused for the few
# seconds of the handover, restarted afterwards.
PAUSE_SERVICES=beszel-agent
