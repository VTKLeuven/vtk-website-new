name: Deploy to Production (liv)

on:
  # Alleen handmatig te starten vanaf het Actions-tabblad
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  checks: read

jobs:
  verify:
    name: Verify tests passed on main
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check CI test status on main for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          echo "Controleer teststatus voor commit $COMMIT_SHA..."

          # Vraag alle check-runs op via de GitHub API voor deze commit
          CHECKS_JSON=$(gh api "repos/${{ github.repository }}/commits/$COMMIT_SHA/check-runs")

          # We vereisen dat types/lint, de tests en 'Production build and browser smoke' geslaagd zijn.
          # Bij eventuele retries nemen we per job de meest recente run (max_by(.id)).
          # Sinds november 2026 zijn types/lint en de tests twee aparte checks;
          # een oudere commit heeft nog de samengevoegde "Types, lint and tests".
          # Per naam telt de laatste run.
          latest() {
            echo "$CHECKS_JSON" | jq -r --arg name "$1" '
              [ .check_runs[]? | select(.name == $name) ] | max_by(.id) // {}
              | "\(.status // "")/\(.conclusion // "")"'
          }
          TYPES="$(latest "Types and lint")"
          TESTS="$(latest "Unit and integration tests")"
          LEGACY="$(latest "Types, lint and tests")"
          BUILD="$(latest "Production build and browser smoke")"

          echo "Types and lint: $TYPES"
          echo "Unit and integration tests: $TESTS"
          echo "Types, lint and tests (oud): $LEGACY"
          echo "Production build and browser smoke: $BUILD"

          ok=completed/success
          if { { [ "$TYPES" = "$ok" ] && [ "$TESTS" = "$ok" ]; } || [ "$LEGACY" = "$ok" ]; } && [ "$BUILD" = "$ok" ]; then
            echo "✅ Alle vereiste checks zijn geslaagd voor commit $COMMIT_SHA."
          else
            echo "::error::Productie-deployment geblokkeerd! Commit $COMMIT_SHA is nog niet geslaagd voor alle vereiste checks op main."
            echo ""
            echo "Zorg ervoor dat de checks op main groen zijn voordat je naar productie deployt."
            exit 1
          fi

  deploy:
    name: Deploy through SSH to Liv
    needs: [verify]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://vtk.be

    steps:
      # Enkel nodig om infra/deploy.sh mee te hebben; de runner bouwt niets.
      - name: Checkout deploy script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: infra/deploy.sh
          sparse-checkout-cone-mode: false

      - name: Check required secrets for prod
        run: |
          if [ -z "${{ secrets.PROD_SSH_HOST || secrets.SSH_HOST }}" ]; then
            echo "::error::Secret PROD_SSH_HOST (of SSH_HOST) is niet geconfigureerd in GitHub repository secrets!"
            exit 1
          fi
          if [ -z "${{ secrets.PROD_SSH_KEY || secrets.SSH_KEY }}" ]; then
            echo "::error::Secret PROD_SSH_KEY (of SSH_KEY) is niet geconfigureerd in GitHub repository secrets!"
            exit 1
          fi

      - name: Install SSH key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_KEY || secrets.SSH_KEY }}

      # Dezelfde deploylogica als dev, uit infra/deploy.sh. `required` betekent:
      # weiger te deployen wanneer het NFS-volume niet gemonteerd is, zodat we
      # nooit tegen de lokale fallbackmap draaien.
      - name: Deploy through SSH
        env:
          SSH_USER: ${{ secrets.PROD_SSH_USER || secrets.SSH_USER || 'it' }}
          SSH_HOST: ${{ secrets.PROD_SSH_HOST || secrets.SSH_HOST }}
          GIT_SHA: ${{ github.sha }}
        run: |
          # `ServerAliveInterval`: tijdens het bouwen staat deze sessie minutenlang
          # stil (de drie builds schrijven naar een logbestand op de server), en
          # een stille TCP-verbinding wordt onderweg afgeschoten. Dat is precies
          # hoe run 34767614290 sneuvelde: "client_loop: send disconnect: Broken
          # pipe", 4,5 minuten na de laatste regel. De client stuurt nu elke 30
          # seconden een teken van leven en houdt het 20 keer vol, dus een echt
          # dode verbinding valt na tien minuten alsnog op.
          ssh -o StrictHostKeyChecking=no -o BatchMode=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "$SSH_USER@$SSH_HOST" \
            bash -s -- "$GIT_SHA" required < infra/deploy.sh
