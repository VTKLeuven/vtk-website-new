name: Deploy to Production (liv)

on:
  # Alleen handmatig te starten vanaf het Actions-tabblad
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  checks: read

jobs:
  verify:
    name: Verify tests passed on main
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Check CI test status on main for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          echo "Controleer teststatus voor commit $COMMIT_SHA..."

          # Vraag alle check-runs op via de GitHub API voor deze commit
          CHECKS_JSON=$(gh api "repos/${{ github.repository }}/commits/$COMMIT_SHA/check-runs")

          # We vereisen dat 'Types, lint and tests' en 'Production build and browser smoke' beide geslaagd zijn.
          # Bij eventuele retries nemen we per job de meest recente run (max_by(.id)).
          CHECK_RESULT=$(echo "$CHECKS_JSON" | jq -r '
            [ .check_runs[]? | select(.name == "Types, lint and tests" or .name == "Production build and browser smoke") ]
            | group_by(.name)
            | map(max_by(.id)) as $latest
            | {
                types_lint_tests: ($latest[]? | select(.name == "Types, lint and tests") | {status, conclusion}),
                build_smoke: ($latest[]? | select(.name == "Production build and browser smoke") | {status, conclusion})
              }
          ')

          TYPES_STATUS=$(echo "$CHECK_RESULT" | jq -r '.types_lint_tests.status // empty')
          TYPES_CONCLUSION=$(echo "$CHECK_RESULT" | jq -r '.types_lint_tests.conclusion // empty')
          BUILD_STATUS=$(echo "$CHECK_RESULT" | jq -r '.build_smoke.status // empty')
          BUILD_CONCLUSION=$(echo "$CHECK_RESULT" | jq -r '.build_smoke.conclusion // empty')

          echo "Status 'Types, lint and tests': status='$TYPES_STATUS', conclusion='$TYPES_CONCLUSION'"
          echo "Status 'Production build and browser smoke': status='$BUILD_STATUS', conclusion='$BUILD_CONCLUSION'"

          if [ "$TYPES_STATUS" = "completed" ] && [ "$TYPES_CONCLUSION" = "success" ] && \
             [ "$BUILD_STATUS" = "completed" ] && [ "$BUILD_CONCLUSION" = "success" ]; then
            echo "✅ Alle vereiste tests ('Types, lint and tests' en 'Production build and browser smoke') zijn geslaagd voor commit $COMMIT_SHA."
          else
            echo "::error::Productie-deployment geblokkeerd! Commit $COMMIT_SHA is nog niet geslaagd voor alle vereiste checks op main."
            echo " - 'Types, lint and tests': status='$TYPES_STATUS', conclusion='$TYPES_CONCLUSION'"
            echo " - 'Production build and browser smoke': status='$BUILD_STATUS', conclusion='$BUILD_CONCLUSION'"
            echo ""
            echo "Zorg ervoor dat de checks op main groen zijn voordat je naar productie deployt."
            exit 1
          fi

  deploy:
    name: Deploy through SSH to Liv
    needs: [verify]
    runs-on: ubuntu-latest

    steps:
      # Enkel nodig om infra/deploy.sh mee te hebben; de runner bouwt niets.
      - name: Checkout deploy script
        uses: actions/checkout@v5
        with:
          sparse-checkout: infra/deploy.sh
          sparse-checkout-cone-mode: false

      - name: Check required secrets for prod
        run: |
          if [ -z "${{ secrets.PROD_SSH_HOST || secrets.SSH_HOST }}" ]; then
            echo "::error::Secret PROD_SSH_HOST (of SSH_HOST) is niet geconfigureerd in GitHub repository secrets!"
            exit 1
          fi
          if [ -z "${{ secrets.PROD_SSH_KEY || secrets.SSH_KEY }}" ]; then
            echo "::error::Secret PROD_SSH_KEY (of SSH_KEY) is niet geconfigureerd in GitHub repository secrets!"
            exit 1
          fi

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_KEY || secrets.SSH_KEY }}

      # Dezelfde deploylogica als dev, uit infra/deploy.sh. `required` betekent:
      # weiger te deployen wanneer het NFS-volume niet gemonteerd is, zodat we
      # nooit tegen de lokale fallbackmap draaien.
      - name: Deploy through SSH
        env:
          SSH_USER: ${{ secrets.PROD_SSH_USER || secrets.SSH_USER || 'it' }}
          SSH_HOST: ${{ secrets.PROD_SSH_HOST || secrets.SSH_HOST }}
          GIT_SHA: ${{ github.sha }}
        run: |
          ssh -o StrictHostKeyChecking=no -o BatchMode=yes "$SSH_USER@$SSH_HOST" \
            bash -s -- "$GIT_SHA" required < infra/deploy.sh
