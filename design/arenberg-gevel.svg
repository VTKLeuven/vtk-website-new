  <title>Arenbergkasteel, vooraanzicht</title>
  <!--
    Vooraanzicht van het Arenbergkasteel als lijntekening, in de tekentaal van
    technisch-pattern.svg: een omtrek, gearceerde daken (45 graden) en de gevel
    in dunne lijnen. Omtrek en daken zijn overgetrokken uit een gevelfoto; ramen,
    lijsten, poort, klokje en erker zijn daarop opgemeten. Coordinaten zijn
    pixels van die foto (2000 x 1125).

    Alles volgt currentColor: zet `color` op het element dat de tekening
    insluit (navy op papier, papier op navy).
  -->
