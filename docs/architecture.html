<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>VTK Architecture · Archify</title>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ═══════ TOKENS ═══════ */
:root{
  --bg:#090d17;--bg2:#0f1629;--bg3:#151d30;
  --surface:rgba(22,33,62,.82);--surface-hi:rgba(30,45,80,.9);
  --border:rgba(148,163,184,.1);--border-hi:rgba(99,102,241,.5);
  --tx:#e2e8f0;--tx2:#94a3b8;--tx3:#64748b;--head:#f8fafc;
  --apps:#38bdf8;--pkgs:#818cf8;--work:#f59e0b;--data:#34d399;--ext:#c084fc;
  --up:#10b981;--dn:#f59e0b;--accent:#6366f1;
  --idle:rgba(148,163,184,.12);
}
[data-theme=light]{
  --bg:#f1f5f9;--bg2:#e2e8f0;--bg3:#fff;
  --surface:rgba(255,255,255,.92);--surface-hi:rgba(241,245,249,1);
  --border:rgba(0,0,0,.08);--border-hi:rgba(99,102,241,.45);
  --tx:#1e293b;--tx2:#475569;--tx3:#94a3b8;--head:#0f172a;
  --idle:rgba(100,116,139,.12);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);overflow-x:hidden}

/* ═══════ HEADER ═══════ */
header{
  position:sticky;top:0;z-index:60;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  background:rgba(9,13,23,.75);border-bottom:1px solid var(--border);
  padding:.65rem 1.25rem;display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;
}
[data-theme=light] header{background:rgba(241,245,249,.85)}
.logo{display:flex;align-items:center;gap:.55rem}
.logo-mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:grid;place-items:center;color:#fff;font-weight:800;font-size:.95rem;box-shadow:0 2px 8px rgba(99,102,241,.35)}
.logo h1{font-size:1.05rem;font-weight:700;color:var(--head);letter-spacing:-.02em}
.logo p{font-size:.62rem;color:var(--tx3);font-family:'Fira Code',monospace}
.spacer{flex:1}
.sb{position:relative;width:200px}
.sb input{width:100%;padding:.38rem .6rem .38rem 1.8rem;border-radius:7px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--tx);font-size:.78rem;outline:none;transition:.2s}
.sb input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(99,102,241,.2)}
.sb svg{position:absolute;left:.55rem;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--tx3);fill:none}
.pills{display:flex;gap:2px;background:rgba(255,255,255,.03);border-radius:7px;padding:2px;border:1px solid var(--border)}
.pill{padding:.32rem .65rem;border-radius:5px;border:none;background:0;color:var(--tx3);font-size:.72rem;font-weight:500;cursor:pointer;transition:.2s}
.pill:hover{color:var(--tx);background:rgba(255,255,255,.06)}
.pill.on{background:var(--accent);color:#fff;box-shadow:0 1px 5px rgba(99,102,241,.3)}
.ibtn{width:30px;height:30px;border-radius:7px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--tx);cursor:pointer;display:grid;place-items:center;font-size:.9rem;transition:.2s}
.ibtn:hover{background:rgba(255,255,255,.08)}

/* ═══════ CANVAS — fixed-position diagram ═══════ */
#canvas{position:relative;width:100%;min-height:100vh;padding:1.5rem}
svg#wires{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1}

/* ═══════ TIER LANES — horizontal swim-lanes ═══════ */
.lane{position:relative;z-index:2;margin-bottom:.6rem;border-radius:14px;background:var(--bg2);border:1px solid var(--border);overflow:hidden}
.lane-hdr{display:flex;align-items:center;gap:.5rem;padding:.55rem 1rem;border-bottom:1px solid var(--border);background:var(--bg3)}
.lane-dot{width:8px;height:8px;border-radius:50%}
.lane-name{font-size:.82rem;font-weight:700;color:var(--head)}
.lane-cnt{font-size:.62rem;font-family:'Fira Code',monospace;color:var(--tx3);margin-left:auto;padding:.1rem .4rem;border-radius:8px;background:rgba(255,255,255,.05)}
.lane-body{display:flex;flex-wrap:wrap;gap:.65rem;padding:.75rem 1rem}

/* ═══════ NODE — compact inline block ═══════ */
.node{
  display:flex;align-items:center;gap:.45rem;
  padding:.45rem .7rem;border-radius:8px;
  background:var(--surface);border:1px solid var(--border);
  cursor:pointer;transition:all .2s cubic-bezier(.16,1,.3,1);
  position:relative;min-width:0;
}
.node:hover{background:var(--surface-hi);border-color:var(--border-hi);transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.2)}
.node.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent),0 4px 14px rgba(99,102,241,.25)}
.node.dim{opacity:.15;pointer-events:none;transform:scale(.97)}
.node.hl-u{border-color:var(--up);box-shadow:0 0 0 2px var(--up)}
.node.hl-d{border-color:var(--dn);box-shadow:0 0 0 2px var(--dn)}
.n-ico{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;font-size:.85rem;flex-shrink:0}
.n-body{min-width:0;flex:1}
.n-name{font-size:.78rem;font-weight:600;color:var(--head);font-family:'Fira Code',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n-sub{font-size:.6rem;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n-port{font-size:.55rem;font-family:'Fira Code',monospace;padding:.08rem .3rem;border-radius:3px;background:rgba(99,102,241,.1);color:#818cf8;border:1px solid rgba(99,102,241,.2);white-space:nowrap;flex-shrink:0}

/* ═══════ DETAIL PANEL ═══════ */
.overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.5);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:.25s}
.overlay.on{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:100vw;background:var(--bg2);border-left:1px solid var(--border);z-index:101;transform:translateX(100%);transition:transform .3s cubic-bezier(.16,1,.3,1);display:flex;flex-direction:column;box-shadow:-6px 0 24px rgba(0,0,0,.35)}
.panel.on{transform:translateX(0)}
.panel-hdr{padding:1rem 1.25rem;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:.6rem}
.p-tier{font-size:.6rem;font-weight:700;text-transform:uppercase;color:var(--accent);margin-bottom:.1rem;letter-spacing:.04em}
.p-name{font-size:1.1rem;font-weight:800;font-family:'Fira Code',monospace;color:var(--head)}
.p-close{background:0;border:0;color:var(--tx3);cursor:pointer;padding:.3rem;border-radius:5px;font-size:1rem;line-height:1}
.p-close:hover{background:rgba(255,255,255,.08);color:var(--tx)}
.panel-body{padding:1rem 1.25rem;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:1.1rem}
.sec{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--tx3);margin-bottom:.25rem}
.sec.up{color:var(--up)}.sec.dn{color:var(--dn)}
.p-desc{font-size:.84rem;line-height:1.55;color:var(--tx2)}
.p-path{font-family:'Fira Code',monospace;font-size:.75rem;background:rgba(0,0,0,.25);padding:.4rem .6rem;border-radius:6px;border:1px solid var(--border);word-break:break-all}
[data-theme=light] .p-path{background:rgba(0,0,0,.04)}
.p-tags{display:flex;flex-wrap:wrap;gap:.35rem}
.tag{font-size:.65rem;padding:.12rem .4rem;border-radius:4px;background:rgba(255,255,255,.05);color:var(--tx2);border:1px solid var(--border)}
.dep-list{list-style:none;display:flex;flex-direction:column;gap:.3rem}
.dep-it{display:flex;align-items:center;gap:.4rem;font-size:.78rem;padding:.3rem .5rem;border-radius:5px;background:rgba(255,255,255,.02);border:1px solid var(--border);cursor:pointer;transition:.15s}
.dep-it:hover{background:rgba(99,102,241,.1);border-color:var(--accent)}
.dep-it strong{flex:1;font-weight:600}
.dep-hint{font-size:.62rem;color:var(--tx3);margin-left:auto}
.p-notes{font-size:.78rem;line-height:1.5;color:var(--tx2);background:rgba(255,255,255,.02);padding:.6rem .7rem;border-radius:7px;border:1px solid var(--border)}

/* ═══════ LEGEND ═══════ */
.legend{position:fixed;bottom:1.2rem;left:1.2rem;z-index:40;display:flex;gap:.6rem;font-size:.65rem;color:var(--tx3);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:.4rem .7rem;backdrop-filter:blur(10px)}
.legend kbd{display:inline-block;padding:.06rem .28rem;border-radius:3px;background:rgba(255,255,255,.07);border:1px solid var(--border);font-family:'Fira Code',monospace;font-size:.6rem;color:var(--tx)}

/* ═══════ ANIMATION ═══════ */
@keyframes dash{to{stroke-dashoffset:-24}}

/* ═══════ RESPONSIVE ═══════ */
@media(max-width:768px){
  header{padding:.6rem .8rem}
  .sb{width:100%}
  .legend{display:none}
  .lane-body{flex-direction:column}
}
</style>
</head>

const M=Object.create(null);
N.forEach(n=>{n.by=[];M[n.id]=n});
N.forEach(n=>(n.u||[]).forEach(d=>{const x=M[d];if(x&&!x.by.includes(n.id))x.by.push(n.id)}));

/* ── TIER META ── */
const TIERS=[
  {id:"apps",   label:"Client Applications",        dot:"var(--apps)"},
  {id:"packages",label:"Shared Domain Packages",    dot:"var(--pkgs)"},
  {id:"workers",label:"Background Cron Workers",    dot:"var(--work)"},
  {id:"data",   label:"Data Storage & Infrastructure",dot:"var(--data)"},
];

/* ── STATE ── */
let sel=null, tier='all';

/* ═══════ RENDER ═══════ */
function render(){
  const root=document.getElementById('lanes');
  root.innerHTML='';
  TIERS.forEach(T=>{
    const items=N.filter(n=>n.t===T.id);
    const lane=document.createElement('div');
    lane.className='lane';lane.dataset.tier=T.id;
    lane.innerHTML=`<div class="lane-hdr"><div class="lane-dot" style="background:${T.dot}"></div><span class="lane-name">${T.label}</span><span class="lane-cnt">${items.length}</span></div>`;
    const body=document.createElement('div');body.className='lane-body';
    items.forEach(n=>{
      const el=document.createElement('div');
      el.className='node';el.id='n-'+n.id;
      el.onclick=()=>pick(n.id);
      el.innerHTML=`<div class="n-ico" style="background:${n.c}18;color:${n.c}">${n.ic}</div><div class="n-body"><div class="n-name">${n.nm}</div><div class="n-sub">${n.sub}</div></div>${n.port?`<span class="n-port">${n.port}</span>`:''}`;
      body.appendChild(el);
    });
    lane.appendChild(body);root.appendChild(lane);
  });
  applyTier();
  requestAnimationFrame(wires);
}

/* ═══════ TIER FILTER ═══════ */
function applyTier(){
  document.querySelectorAll('.lane').forEach(l=>{
    l.style.display=(tier==='all'||l.dataset.tier===tier)?'':'none';
  });
}
document.getElementById('pills').addEventListener('click',e=>{
  const b=e.target.closest('.pill');if(!b)return;
  tier=b.dataset.t;
  document.querySelectorAll('.pill').forEach(p=>p.classList.toggle('on',p===b));
  applyTier();requestAnimationFrame(wires);
});

/* ═══════ SELECT ═══════ */
function pick(id){
  if(sel===id){unpick();return}
  sel=id;const nd=M[id];if(!nd){unpick();return}
  document.querySelectorAll('.node').forEach(e=>e.classList.remove('sel','dim','hl-u','hl-d'));
  const el=document.getElementById('n-'+id);if(el)el.classList.add('sel');
  N.forEach(n=>{if(n.id===id)return;const c=document.getElementById('n-'+n.id);if(!c)return;
    if(nd.u.includes(n.id))c.classList.add('hl-u');
    else if(nd.by.includes(n.id))c.classList.add('hl-d');
    else c.classList.add('dim');
  });
  openPanel(nd);wires();
}
function unpick(){
  sel=null;
  document.querySelectorAll('.node').forEach(e=>e.classList.remove('sel','dim','hl-u','hl-d'));
  closePanel();wires();
}

/* ═══════ WIRES ═══════ */
function wires(){
  const svg=document.getElementById('wires');
  while(svg.children.length>1)svg.removeChild(svg.lastChild);
  svg.setAttribute('width',document.documentElement.scrollWidth);
  svg.setAttribute('height',document.documentElement.scrollHeight);
  N.forEach(nd=>{
    const from=document.getElementById('n-'+nd.id);
    if(!from||from.offsetParent===null)return;
    nd.u.forEach(did=>{
      const to=document.getElementById('n-'+did);
      if(!to||to.offsetParent===null)return;
      const r1=from.getBoundingClientRect(),r2=to.getBoundingClientRect();
      const x1=r1.left+r1.width/2+scrollX,y1=r1.bottom+scrollY;
      const x2=r2.left+r2.width/2+scrollX,y2=r2.top+scrollY;
      const dy=Math.max(Math.abs(y2-y1)*.4,20);
      const path=document.createElementNS('http://www.w3.org/2000/svg','path');
      path.setAttribute('d',`M${x1} ${y1}C${x1} ${y1+dy},${x2} ${y2-dy},${x2} ${y2}`);
      path.setAttribute('fill','none');
      let hl=false,col='var(--idle)',w='1',mk='url(#a0)';
      if(sel){
        if(nd.id===sel){col='var(--up)';w='2.2';mk='url(#au)';hl=true}
        else if(did===sel){col='var(--dn)';w='2.2';mk='url(#ad)';hl=true}
      }
      if(sel&&!hl)path.setAttribute('opacity','.04');
      path.setAttribute('stroke',col);path.setAttribute('stroke-width',w);path.setAttribute('marker-end',mk);
      if(hl){path.setAttribute('stroke-dasharray','7 4');path.style.animation='dash .8s linear infinite'}
      svg.appendChild(path);
    });
  });
}

/* ═══════ PANEL ═══════ */
function openPanel(nd){
  document.getElementById('pt').textContent=nd.t.toUpperCase();
  document.getElementById('pn').textContent=nd.nm;
  document.getElementById('pd').textContent=nd.d;
  document.getElementById('pp').textContent=nd.p;
  document.getElementById('po').textContent=nd.n;
  document.getElementById('pk').innerHTML=nd.k.map(t=>`<span class="tag">${t}</span>`).join('');
  const depHtml=(ids,empty)=>ids.length?ids.map(id=>{const x=M[id];if(!x)return'';return`<li class="dep-it" onclick="pick('${id}')"><span>${x.ic}</span><strong>${x.nm}</strong><span class="dep-hint">${x.t}</span></li>`}).join(''):`<li style="font-size:.75rem;color:var(--tx3);padding:.2rem">${empty}</li>`;
  document.getElementById('pu').innerHTML=depHtml(nd.u,'None (base)');
  document.getElementById('pb').innerHTML=depHtml(nd.by,'None (leaf)');
  document.getElementById('pnl').classList.add('on');
  document.getElementById('ov').classList.add('on');
}
function closePanel(){
  document.getElementById('pnl').classList.remove('on');
  document.getElementById('ov').classList.remove('on');
}
document.getElementById('ov').addEventListener('click',unpick);
document.getElementById('px').addEventListener('click',unpick);

/* ═══════ SEARCH ═══════ */
document.getElementById('q').addEventListener('input',e=>{
  const q=e.target.value.toLowerCase().trim();
  N.forEach(nd=>{
    const el=document.getElementById('n-'+nd.id);if(!el)return;
    if(!q){el.style.display='';return}
    const hit=nd.nm.toLowerCase().includes(q)||nd.d.toLowerCase().includes(q)||nd.k.some(t=>t.toLowerCase().includes(q))||nd.p.toLowerCase().includes(q)||nd.sub.toLowerCase().includes(q);
    el.style.display=hit?'':'none';
  });
  requestAnimationFrame(wires);
});

/* ═══════ THEME ═══════ */
document.getElementById('thm').addEventListener('click',()=>{
  const d=document.documentElement;const isDark=d.dataset.theme!=='light';
  d.dataset.theme=isDark?'light':'dark';
  document.getElementById('thm').textContent=isDark?'☀️':'🌙';
  requestAnimationFrame(wires);
});

/* ═══════ KEYS ═══════ */
addEventListener('keydown',e=>{
  const inp=document.activeElement?.tagName==='INPUT';
  if(e.key==='/'&&!inp){e.preventDefault();document.getElementById('q').focus()}
  else if(e.key==='Escape'){unpick();document.getElementById('q').blur()}
  else if((e.key==='t'||e.key==='T')&&!inp)document.getElementById('thm').click();
});

/* ═══════ RESIZE ═══════ */
let raf;
function sched(){cancelAnimationFrame(raf);raf=requestAnimationFrame(wires)}
addEventListener('resize',sched);
addEventListener('scroll',sched,{passive:true});

/* ═══════ INIT ═══════ */
render();
</script>
</body>
</html>
