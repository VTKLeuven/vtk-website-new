# The local development database, and nothing else.
#
# Deliberately a separate file from `docker-compose.yml`: that one is the deploy
# stack. It builds the web and logistiek images and starts Immich, Umami and five
# workers, none of which belong on a laptop. Bringing it up locally gives you a
# second Postgres on the same data volume as your development database; that is
# one data directory with two postmasters, which ends badly sooner or later.
#
# Own project name (`name:`) and own volume, so this database is independent of
# the deploy stack. If you previously ran a manual `docker run --name
# vtk-postgres`, that old volume is left untouched next to this one; you lose
# nothing, but this database does start empty. `make db` fills it.
name: vtk-dev

services:
  postgres:
    image: postgres:16
    container_name: vtk-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vtk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vtk}
      POSTGRES_DB: ${POSTGRES_DB:-vtk}
    ports:
      # 5433 rather than 5432: plenty of laptops already run their own Postgres
      # on the default port. `.env.example` points here.
      #
      # Explicitly bound to 127.0.0.1. Without that address the port listens on
      # every interface, leaving a database whose password is `vtk` open to
      # everyone on the same wifi network.
      - "127.0.0.1:5433:5432"
    volumes:
      - dev-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-vtk}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Object storage, so uploads work locally at all.
  #
  # Without a bucket every `/api/media/...` is a 404 and every upload field in
  # the admin fails, which makes photos on the homepage, the front pages and the
  # pages impossible to try out. `lib/storage.ts` already assumed something on
  # :9000 lived here; it just was never in a compose file.
  minio:
    image: minio/minio:latest
    container_name: vtk-dev-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-vtkdev}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-vtkdevsecret}
    ports:
      # 9000 is the S3 API, 9001 the web console. Loopback only, same reason as
      # Postgres: these credentials are `vtkdev` and are not a secret.
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - dev-minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the bucket once and exits. MinIO does not make one on first start,
  # and an upload into a missing bucket fails with an error that says nothing
  # about the bucket.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${BUCKET}" &&
        echo "bucket $${BUCKET} ready"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-vtkdev}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-vtkdevsecret}
      BUCKET: ${S3_BUCKET:-vtk}
    restart: "no"

  # De wachtwoordkluis. Vaultwarden praat de Bitwarden-API, dus de gewone
  # Bitwarden-clients (browser-extensie, mobiel, desktop) werken erop, en wij
  # schrijven er vanuit de admin items in met de organisatiesleutel.
  #
  # Lokaal bewust zonder SSO: `SSO_ONLY` zou je buitensluiten zodra de
  # OAuth-client nog niet bestaat, en dan kan je niet meer aan het botaccount.
  # Zet SSO pas aan wanneer je die flow zelf wil testen; de deploy-stack in
  # `docker-compose.yml` heeft ze wel aan.
  vaultwarden:
    image: vaultwarden/server:1.35.1
    container_name: vtk-dev-vaultwarden
    restart: unless-stopped
    environment:
      DOMAIN: http://localhost:8222
      # Aanmelden staat lokaal open zodat je zelf het botaccount en een
      # testlid kan aanmaken. In productie staat dit uit en komt iedereen
      # binnen via SSO plus een uitnodiging.
      SIGNUPS_ALLOWED: "true"
      # Zonder dit bestaan groepen niet, en dan valt de koppeling post ->
      # groep -> collection weg waar deze hele integratie op draait.
      ORG_GROUPS_ENABLED: "true"
      # Bespaart het lid een klik op een uitnodigingsmail: inloggen volstaat,
      # de sync bevestigt daarna. Lokaal vertrekt er sowieso geen mail.
      ORGANIZATION_INVITE_AUTO_ACCEPT: "true"
      ROCKET_PORT: "80"
    ports:
      # Loopback only, net als Postgres en MinIO hierboven.
      - "127.0.0.1:8222:80"
    volumes:
      - dev-vaultwarden-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/alive || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  dev-postgres-data:
  dev-minio-data:
  dev-vaultwarden-data:
